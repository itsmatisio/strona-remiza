<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>remiza.lol</title>
    <!-- Tailwind CSS for clean layout utility -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e4e4e7;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6">

    <main class="w-full max-w-2xl mx-auto my-auto text-center py-12">
        <!-- Logo / Tag -->
        <div class="inline-block px-3 py-1 bg-zinc-800 text-zinc-400 text-xs font-mono rounded-full mb-6">
            remiza.lol
        </div>

        <!-- Main Heading -->
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white mb-3">
            Trwają prace nad stroną
        </h1>
        
        <p class="text-zinc-400 text-base sm:text-lg mb-8 max-w-md mx-auto">
            Na razie nic tu nie ma. Zapraszamy do śledzenia naszego Discorda oraz odwiedzenia sklepu.
        </p>

        <!-- Links / Action Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mb-10 w-full max-w-xs mx-auto">
            <a href="https://sklep.remiza.lol" target="_blank" rel="noopener noreferrer" 
               class="w-full px-5 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-white font-medium rounded-lg border border-zinc-700 text-sm transition-colors text-center">
                Sklep (sklep.remiza.lol)
            </a>
            
            <a href="https://discord.gg/QJJ52429gV" target="_blank" rel="noopener noreferrer" 
               class="w-full px-5 py-2.5 bg-zinc-100 hover:bg-white text-zinc-900 font-medium rounded-lg text-sm transition-colors text-center">
                Discord
            </a>
        </div>

        <!-- NameMC Server Status Widget Container -->
        <div class="w-full pt-8 border-t border-zinc-800/80">
            <p class="text-xs text-zinc-500 uppercase tracking-wider mb-4 font-medium">Status serwera</p>
            <div class="w-full overflow-hidden flex justify-center items-center">
                <iframe style="width:728px;height:90px;max-width:100%;border:none;display:block;margin:auto" src="https://pl.namemc.com/server/remiza.lol/embed" width="728" height="90" title="Status NameMC remiza.lol"></iframe>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-zinc-600">
        &copy; <span id="year"></span> remiza.lol
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
